<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <title>Favorite - Movie</title>
  </head>
  <body>
    <div class="form_container">
      <h1>Enter your favorite Movie and Rate it from 1 to 10!</h1>
      <form action="/submit" method="post">
        <label for="movie">Movie</label>
        <input
          type="text"
          name="movie"
          placeholder="Your favorite movie"
          required
        />
        <label for="rete">Rating: </label>
        <input type="number" placeholder="Rate from 1 to 10" mib="1" max="10" />
      </form>
    </div>
  </body>
